name: Oppdater norske dagligvarebutikker
on:
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/update-stores.mjs
      - name: Lagre endringer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stores.json
          if ! git diff --cached --quiet; then
            git commit -m "Oppdater norske dagligvarebutikker"
            git push
          fi
