name: Oppdater norske dagligvarebutikker
on:
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer OSM-leser
        run: python -m pip install --disable-pip-version-check osmium
      - name: Hent og behandle Norges butikkdata
        run: python scripts/update-stores.py
      - name: Lagre endringer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stores.json
          if ! git diff --cached --quiet; then
            git commit -m "Oppdater norske dagligvarebutikker"
            git push
          fi
